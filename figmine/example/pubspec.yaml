name: figmine_example
description: Demonstrates a theme generated by figmine.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  figmine:
    path: ../
  flutter:
    sdk: flutter
  material_ui: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/figmine/icons/
